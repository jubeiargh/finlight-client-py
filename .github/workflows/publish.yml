name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must equal the package version (tags have no "v" prefix)
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('finlight_client/_version.py').read()).group(1))")
          test "$GITHUB_REF_NAME" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: pip install build
      - run: rm -rf dist && python -m build --outdir dist
      - run: python scripts/check_package.py
      - uses: pypa/gh-action-pypi-publish@release/v1
