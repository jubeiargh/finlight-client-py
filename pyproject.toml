[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finlight-client"
dynamic = ["version"]
description = "Python client for the finlight API v3 (breaking release: speaks only API v3)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Büyükkakac", email = "ali@finlight.me" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "pydantic>=2.7,<3",
    "websockets>=15.0,<18",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://finlight.me"
Documentation = "https://docs.finlight.me"
Source = "https://github.com/jubeiargh/finlight-client-py"
Changelog = "https://github.com/jubeiargh/finlight-client-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0.10",
    "pytest-socket>=0.7",
]
dev = [
    "finlight-client[test]",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.2",
]

[tool.setuptools.dynamic]
version = { attr = "finlight_client._version.__version__" }

[tool.setuptools.packages.find]
include = ["finlight_client", "finlight_client.*"]
exclude = ["tests", "tests.*", "conformance", "local", "examples", "scripts"]

[tool.setuptools.package-data]
finlight_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: runs against the dev API (needs FINLIGHT_API_KEY, FINLIGHT_BASE_URL, FINLIGHT_WSS_URL and the owner's okay)",
]
addopts = "-m 'not live' --disable-socket --allow-hosts=127.0.0.1,localhost,::1"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["UP007", "UP045", "E501", "B008", "UP031", "N818"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["finlight_client"]
plugins = ["pydantic.mypy"]
